---
# Event-Driven Ansible: Snowflake alerts -> PLATFORM_EVENTS -> remediation playbook.
#
# Local (ansible-rulebook), after `ansible-galaxy collection install -r collections/requirements.yml -p ./collections`:
#   ansible-rulebook -r rulebooks/snowflake_self_healing.yml -i inventories/dev/hosts.yml \
#     -S collections/ansible_collections/iacforge/snowflake_iac/extensions/eda/plugins/event_source \
#     --vault-password-file ~/.vault_pass --print-events
#
# EDA Controller: replace run_playbook with
#   run_job_template: {name: "SF - 07 Remediate (dev)", organization: Default, job_args: {extra_vars: {...}}}
- name: Snowflake self-healing
  hosts: snowflake
  sources:
    - name: Snowflake platform events
      snowflake_events:
        poll_seconds: 60
        warehouse: WH_PLATFORM_OPS_DEV       # needed to mark events processed (or set SF_WAREHOUSE)
        role: PLATFORM_AUTOMATION_ROLE
  rules:
    - name: Suspend runaway warehouse
      condition: event.event_type == "CREDIT_SPIKE"
      action:
        run_playbook:
          name: 07_remediate.yml
          extra_vars:
            remediation_action: suspend_warehouse
            wh_name: "{{ event.object_name }}"
            credits_last_hour: "{{ event.detail.credits_last_hour }}"

    - name: Retry failed task
      condition: event.event_type == "TASK_FAILED"
      action:
        run_playbook:
          name: 07_remediate.yml
          extra_vars:
            remediation_action: retry_task
            task_fqn: "{{ event.object_name }}"
            task_error: "{{ event.detail.error }}"
