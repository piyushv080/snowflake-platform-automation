---
# Rotate the automation user's RSA key with Snowflake's two key slots.
# ansible-playbook 05_rotate_keys.yml -e sf_key_rotation_phase=stage     (old key keeps working)
# ansible-playbook 05_rotate_keys.yml -e sf_key_rotation_phase=promote   (after consumers updated)
- name: Rotate Snowflake key pair
  hosts: snowflake
  gather_facts: false
  module_defaults:
    group/iacforge.snowflake_iac.snowflake:
      account: "{{ sf_account }}"
      user: "{{ sf_user }}"
      private_key: "{{ sf_private_key }}"
      private_key_passphrase: "{{ sf_private_key_passphrase }}"
  roles:
    - role: sf_key_rotation
