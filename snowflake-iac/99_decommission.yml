---
# Remove warehouses / databases that are no longer needed.
#   ansible-playbook 99_decommission.yml -e '{"decommission_warehouses": ["WH_OLD"], "confirm_decommission": true}'
- name: Decommission Snowflake objects
  hosts: snowflake
  gather_facts: false
  vars:
    decommission_warehouses: []
    decommission_databases: []
    confirm_decommission: false
  module_defaults:
    group/iacforge.snowflake_iac.snowflake:
      account: "{{ sf_account }}"
      user: "{{ sf_user }}"
      private_key: "{{ sf_private_key }}"
      private_key_passphrase: "{{ sf_private_key_passphrase }}"
  pre_tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm_decommission | bool
        fail_msg: "Set confirm_decommission=true to drop objects"
    - name: Change gate
      ansible.builtin.include_role:
        name: servicenow_change
        tasks_from: gate_start
  tasks:
    - name: Drop warehouses
      iacforge.snowflake_iac.snowflake_warehouse:
        name: "{{ item }}"
        state: absent
        role: "{{ sf_role_sysadmin }}"
      loop: "{{ decommission_warehouses }}"

    - name: Drop databases
      iacforge.snowflake_iac.snowflake_database:
        name: "{{ item }}"
        state: absent
        role: "{{ sf_role_sysadmin }}"
      loop: "{{ decommission_databases }}"
  post_tasks:
    - name: Record result
      ansible.builtin.include_role:
        name: servicenow_change
        tasks_from: gate_end
