---
# One-time: create the automation role + service user using a human ACCOUNTADMIN key.
# ansible-playbook 01_bootstrap.yml --ask-vault-pass
- name: Bootstrap Snowflake automation identity
  hosts: snowflake
  gather_facts: false
  module_defaults:
    group/iacforge.snowflake_iac.snowflake:
      account: "{{ sf_account }}"
      user: "{{ vault_sf_admin_user }}"
      private_key: "{{ vault_sf_admin_private_key }}"
      private_key_passphrase: "{{ vault_sf_admin_private_key_passphrase | default(omit) }}"
  roles:
    - role: sf_bootstrap
