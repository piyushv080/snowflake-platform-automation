[defaults]
# Local runs. AWX ignores [defaults] inventory and uses its own inventory object.
inventory = inventories/dev/hosts.yml
roles_path = ./roles
# ./collections first: `ansible-galaxy collection install -r collections/requirements.yml -p ./collections`
# puts iacforge.snowflake_iac (from GitHub) and the other collections there (git-ignored).
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 5

[inventory]
enable_plugins = yaml, ini, host_list
