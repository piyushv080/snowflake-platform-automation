---
# Collections used by this project. AWX installs these automatically on project sync.
#   Local:  ansible-galaxy collection install -r collections/requirements.yml -p ./collections
collections:
  # Snowflake modules (iacforge.snowflake_iac) - from GitHub, pinned to a release tag.
  # While the repo is private, git needs a GitHub token (locally: git credentials; AWX: a Source Control credential).
  - name: https://github.com/piyushv080/iac_forge.git#/ansible_collections/iacforge/snowflake_iac/
    type: git
    version: snowflake_iac-v0.1.0

  - name: servicenow.itsm          # change_request_info, api, incident
    version: ">=2.6.0"
  - name: ansible.windows          # win_powershell (AD sync over WinRM)
    version: ">=2.3.0"
  - name: awx.awx                  # awx/configure_awx.yml and optional credential update on key rotation
    version: ">=23.0.0"            # pin to your AWX version for best compatibility
