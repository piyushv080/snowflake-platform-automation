---
# Alerts + events table, credit report, warehouse hygiene. Schedule in AWX (e.g. daily 06:00).
- name: Snowflake monitoring
  hosts: snowflake
  gather_facts: false
  module_defaults:
    group/iacforge.snowflake_iac.snowflake:
      account: "{{ sf_account }}"
      user: "{{ sf_user }}"
      private_key: "{{ sf_private_key }}"
      private_key_passphrase: "{{ sf_private_key_passphrase }}"
  roles:
    - role: sf_monitoring
