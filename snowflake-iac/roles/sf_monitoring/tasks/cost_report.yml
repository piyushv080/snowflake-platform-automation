---
- name: Query credits per warehouse
  snowflake_query:
    sql: >-
      SELECT warehouse_name,
             ROUND(SUM(credits_used), 2) AS credits,
             ROUND(SUM(credits_used_compute), 2) AS compute_credits,
             ROUND(SUM(credits_used_cloud_services), 2) AS cloud_services_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY
      WHERE start_time >= DATEADD('day', -{{ sf_monitoring_cost_days | int }}, CURRENT_TIMESTAMP())
      GROUP BY warehouse_name
      ORDER BY credits DESC
    read_only: true
    role: "{{ sf_monitoring_role }}"
    warehouse: "{{ sf_monitoring_warehouse }}"
  register: sf_cost

- name: Ensure report directory
  ansible.builtin.file:
    path: "{{ sf_monitoring_report_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  run_once: true

- name: Write HTML and CSV cost reports
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ sf_monitoring_report_dir }}/{{ item | replace('cost_report', 'cost_report_' ~ sf_env) }}"
    mode: "0640"
  loop: [cost_report.html, cost_report.csv]
  delegate_to: localhost
  run_once: true

- name: Cost summary
  ansible.builtin.debug:
    msg: >-
      Last {{ sf_monitoring_cost_days }} days: {{ sf_cost.rows | map(attribute='credits') | sum | round(2) }} credits
      across {{ sf_cost.rows | length }} warehouses. Report: {{ sf_monitoring_report_dir }}/cost_report_{{ sf_env }}.html
