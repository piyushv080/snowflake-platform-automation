---
- name: Ensure warehouses
  snowflake_warehouse:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    size: "{{ item.size | default(omit) }}"
    auto_suspend: "{{ item.auto_suspend | default(omit) }}"
    auto_resume: "{{ item.auto_resume | default(omit) }}"
    resource_monitor: "{{ item.resource_monitor | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    role: "{{ sf_role_sysadmin }}"
  loop: "{{ sf_warehouses }}"
  loop_control:
    label: "{{ item.name }}"
