---
- name: Validate demo database name
  ansible.builtin.assert:
    that:
      - sf_demo_database is match('^[A-Za-z_][A-Za-z0-9_$]*$')
      - sf_demo_trucks | int > 0
      - sf_demo_customers | int > 0
      - sf_demo_orders | int > 0
    quiet: true

- name: Check whether demo data is already loaded
  snowflake_query:
    sql: "SHOW TABLES LIKE 'ORDER_DETAIL' IN SCHEMA {{ sf_demo_database }}.RAW_POS"
    read_only: true
    role: "{{ sf_demo_role }}"
  register: sf_demo_existing
  # In --check on a fresh account the schema does not exist yet.
  failed_when:
    - sf_demo_existing.failed | default(false)
    - "'does not exist' not in (sf_demo_existing.msg | default(''))"

- name: Generate Tasty Bytes style demo data inside Snowflake
  snowflake_query:
    sql: "{{ lookup('ansible.builtin.template', 'tasty_bytes_demo.sql.j2') }}"
    warehouse: "{{ sf_demo_warehouse }}"
    role: "{{ sf_demo_role }}"
    fetch: false
  when: sf_demo_reload | bool or (sf_demo_existing.rows | default([]) | length == 0)

- name: Count demo rows
  snowflake_query:
    sql: >-
      SELECT
        (SELECT COUNT(*) FROM {{ sf_demo_database }}.RAW_POS.TRUCK) AS trucks,
        (SELECT COUNT(*) FROM {{ sf_demo_database }}.RAW_CUSTOMER.CUSTOMER_LOYALTY) AS customers,
        (SELECT COUNT(*) FROM {{ sf_demo_database }}.RAW_POS.ORDER_HEADER) AS orders,
        (SELECT COUNT(*) FROM {{ sf_demo_database }}.RAW_POS.ORDER_DETAIL) AS order_lines
    read_only: true
    warehouse: "{{ sf_demo_warehouse }}"
    role: "{{ sf_demo_role }}"
  register: sf_demo_counts
  when: not ansible_check_mode

- name: Show demo data summary
  ansible.builtin.debug:
    msg: "{{ sf_demo_counts.rows[0] }}"
  when: not ansible_check_mode
