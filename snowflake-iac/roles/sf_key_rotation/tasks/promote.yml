---
- name: Read the staged key
  snowflake_keypair:
    path: "{{ sf_key_rotation_new_key_path }}"
    passphrase: "{{ sf_key_rotation_passphrase }}"
  delegate_to: localhost
  register: sf_staged_key

- name: Promote new key to slot 1 and clear slot 2 (old key stops working)
  snowflake_user:
    name: "{{ sf_key_rotation_user }}"
    rsa_public_key: "{{ sf_staged_key.public_key }}"
    rsa_public_key_2: ""
    role: "{{ sf_role_securityadmin }}"

- name: Update AWX credential with the new private key
  awx.awx.credential:
    name: "{{ sf_key_rotation_awx_credential }}"
    credential_type: "{{ sf_key_rotation_awx_credential_type }}"
    organization: "{{ sf_key_rotation_awx_organization }}"
    inputs:
      account: "{{ sf_account }}"
      user: "{{ sf_key_rotation_user }}"
      private_key: "{{ lookup('ansible.builtin.file', sf_key_rotation_new_key_path) }}"
      private_key_passphrase: "{{ sf_key_rotation_passphrase }}"
    update_secrets: true
  delegate_to: localhost
  no_log: true
  when: sf_key_rotation_update_awx | bool

- name: Next steps
  ansible.builtin.debug:
    msg:
      - "Key for {{ sf_key_rotation_user }} rotated. New fingerprint: {{ sf_staged_key.fingerprint }}"
      - "Update vault_sf_private_key in group_vars/env_{{ sf_env }}/vault.yml with {{ sf_key_rotation_new_key_path }}"
      - "then delete that file from the controller."
