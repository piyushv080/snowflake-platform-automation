---
- name: Generate new key pair on the controller
  snowflake_keypair:
    path: "{{ sf_key_rotation_new_key_path }}"
    passphrase: "{{ sf_key_rotation_passphrase }}"
    force: true
  delegate_to: localhost
  register: sf_new_key

- name: Register new public key in slot 2 (current key keeps working)
  snowflake_user:
    name: "{{ sf_key_rotation_user }}"
    rsa_public_key_2: "{{ sf_new_key.public_key }}"
    role: "{{ sf_role_securityadmin }}"

- name: Verify login with the new key
  block:
    - name: Connect using the new private key
      snowflake_query:
        sql: SELECT CURRENT_USER() AS user_name
        read_only: true
        user: "{{ sf_key_rotation_user }}"
        private_key: "{{ lookup('ansible.builtin.file', sf_key_rotation_new_key_path) }}"
        private_key_passphrase: "{{ sf_key_rotation_passphrase }}"
      register: sf_new_key_login

    - name: Confirm user
      ansible.builtin.assert:
        that: sf_new_key_login.rows[0].user_name | upper == sf_key_rotation_user | upper
  rescue:
    - name: Roll back slot 2
      snowflake_user:
        name: "{{ sf_key_rotation_user }}"
        rsa_public_key_2: ""
        role: "{{ sf_role_securityadmin }}"

    - name: Stop rotation
      ansible.builtin.fail:
        msg: "New key could not log in; slot 2 rolled back, current key unchanged."
