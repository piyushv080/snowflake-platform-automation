---
- name: Require a valid change request number for {{ sf_env }}
  ansible.builtin.assert:
    that: cr_number is match('^CHG[0-9]{7}$')
    fail_msg: "{{ sf_env }} changes need a ServiceNow change request: -e cr_number=CHG0001234"
  when: sf_env in servicenow_require_cr_envs

- name: Look up the change request
  servicenow.itsm.change_request_info:
    instance: "{{ servicenow_instance }}"
    number: "{{ cr_number }}"
  register: sn_cr
  check_mode: false
  when:
    - servicenow_enabled | bool
    - cr_number | length > 0

- name: Change request must be approved and in an allowed state
  ansible.builtin.assert:
    that:
      - sn_cr.records | length == 1
      - sn_cr.records[0].state in servicenow_allowed_states
    fail_msg: >-
      {{ cr_number }} is in state '{{ sn_cr.records[0].state | default('not found') }}',
      allowed: {{ servicenow_allowed_states }}
  when: sn_cr is not skipped

- name: Remember change request sys_id
  ansible.builtin.set_fact:
    sn_cr_sys_id: "{{ sn_cr.records[0].sys_id }}"
  when: sn_cr is not skipped

- name: Work note - run started
  servicenow.itsm.api:
    instance: "{{ servicenow_instance }}"
    resource: change_request
    action: patch
    sys_id: "{{ sn_cr_sys_id }}"
    data:
      work_notes: "Ansible run started: {{ ansible_play_name }} (AWX job {{ awx_job_id | default('local') }})"
  when: sn_cr_sys_id is defined and not ansible_check_mode
