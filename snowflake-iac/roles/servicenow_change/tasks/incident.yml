---
- name: Create ServiceNow incident
  servicenow.itsm.incident:
    instance: "{{ servicenow_instance }}"
    state: new
    short_description: "{{ incident_short_description }}"
    description: "{{ incident_description }}"
    impact: "{{ incident_impact }}"
    urgency: "{{ incident_urgency }}"
  register: sn_incident
  when: servicenow_enabled | bool and not ansible_check_mode

- name: Incident result
  ansible.builtin.debug:
    msg: >-
      {{ ('Incident ' ~ sn_incident.record.number ~ ' created') if sn_incident is not skipped
         else 'ServiceNow disabled - incident would be: ' ~ incident_short_description }}
