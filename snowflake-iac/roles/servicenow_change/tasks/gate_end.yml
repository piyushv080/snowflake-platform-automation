---
- name: Work note - run finished
  servicenow.itsm.api:
    instance: "{{ servicenow_instance }}"
    resource: change_request
    action: patch
    sys_id: "{{ sn_cr_sys_id }}"
    data:
      work_notes: "Ansible run {{ sn_run_status }}: {{ ansible_play_name }} (AWX job {{ awx_job_id | default('local') }})"
  when: sn_cr_sys_id is defined and not ansible_check_mode

- name: Run status
  ansible.builtin.debug:
    msg: "Run {{ sn_run_status }}{{ ' - recorded on ' ~ cr_number if sn_cr_sys_id is defined else '' }}"
