---
# AWX custom credential type. Injects the same variables that group_vars/all/main.yml expects,
# so a job can use either this credential OR Ansible Vault.
name: Snowflake Key Pair
kind: cloud
description: Snowflake key-pair authentication for iacforge.snowflake_iac modules
inputs:
  fields:
    - id: account
      type: string
      label: Account identifier (orgname-accountname)
    - id: user
      type: string
      label: User
    - id: private_key
      type: string
      label: Private key (PEM)
      secret: true
      multiline: true
    - id: private_key_passphrase
      type: string
      label: Private key passphrase
      secret: true
  required: [account, user, private_key]
injectors:
  extra_vars:
    sf_account: "{{ account }}"
    sf_user: "{{ user }}"
    sf_private_key: "{{ private_key }}"
    sf_private_key_passphrase: "{{ private_key_passphrase }}"
  env:
    SF_ACCOUNT: "{{ account }}"
    SF_USER: "{{ user }}"
    SF_PRIVATE_KEY: "{{ private_key }}"
    SF_PRIVATE_KEY_PASSPHRASE: "{{ private_key_passphrase }}"
