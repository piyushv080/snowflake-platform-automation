---
# Configure AWX for this project (run from your laptop, NOT inside AWX):
#   export CONTROLLER_HOST=https://localhost:8043 CONTROLLER_USERNAME=admin CONTROLLER_PASSWORD=...
#   ansible-playbook awx/configure_awx.yml -e awx_scm_url=... -e awx_ee_image=... -e awx_vault_password=...
- name: Configure AWX project, inventories, credentials and job templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - job_templates.yml
  vars:
    awx_org: Default
    awx_project: snowflake-platform-automation
    awx_scm_url: ""                     # e.g. https://github.com/<you>/snowflake-platform-automation.git
    awx_scm_branch: main
    awx_ee_name: snowflake-platform-ee
    awx_ee_image: ""                     # e.g. quay.io/<you>/snowflake-platform-ee:1.0
    awx_vault_password: ""               # pass with -e or vault-encrypted settings file
    awx_environments: [dev]              # add prod when ready
  tasks:
    - name: Validate settings
      ansible.builtin.assert:
        that:
          - awx_scm_url | length > 0
          - awx_ee_image | length > 0
          - awx_vault_password | length > 0
        fail_msg: Set awx_scm_url, awx_ee_image and awx_vault_password (see awx/README.md)

    - name: Custom credential types
      awx.awx.credential_type:
        name: "{{ ct.name }}"
        kind: "{{ ct.kind }}"
        description: "{{ ct.description }}"
        inputs: "{{ ct.inputs }}"
        injectors: "{{ ct.injectors }}"
      vars:
        ct: "{{ lookup('ansible.builtin.file', item) | from_yaml }}"
      loop:
        - credential_types/snowflake_keypair.yml
        - credential_types/servicenow_itsm.yml

    - name: Vault credential (decrypts group_vars/env_*/vault.yml)
      awx.awx.credential:
        name: Vault - snowflake-platform
        organization: "{{ awx_org }}"
        credential_type: Vault
        inputs:
          vault_password: "{{ awx_vault_password }}"
      no_log: true

    - name: Execution environment
      awx.awx.execution_environment:
        name: "{{ awx_ee_name }}"
        image: "{{ awx_ee_image }}"
        organization: "{{ awx_org }}"
        pull: missing

    - name: Project
      awx.awx.project:
        name: "{{ awx_project }}"
        organization: "{{ awx_org }}"
        scm_type: git
        scm_url: "{{ awx_scm_url }}"
        scm_branch: "{{ awx_scm_branch }}"
        scm_update_on_launch: true
        default_environment: "{{ awx_ee_name }}"
        wait: true

    - name: Inventories
      awx.awx.inventory:
        name: "Snowflake Platform - {{ item }}"
        organization: "{{ awx_org }}"
      loop: "{{ awx_environments }}"

    - name: Inventory sources from the project
      awx.awx.inventory_source:
        name: "hosts.yml ({{ item }})"
        inventory: "Snowflake Platform - {{ item }}"
        source: scm
        source_project: "{{ awx_project }}"
        source_path: "inventories/{{ item }}/hosts.yml"
        update_on_launch: true
        overwrite: true
      loop: "{{ awx_environments }}"

    - name: Job templates
      awx.awx.job_template:
        name: "{{ item.1.name }} ({{ item.0 }})"
        description: "{{ item.1.description }}"
        organization: "{{ awx_org }}"
        project: "{{ awx_project }}"
        inventory: "Snowflake Platform - {{ item.0 }}"
        playbook: "{{ item.1.playbook }}"
        execution_environment: "{{ awx_ee_name }}"
        credentials:
          - Vault - snowflake-platform
        ask_variables_on_launch: true
        ask_job_type_on_launch: true          # allows Check runs
        survey_enabled: "{{ item.1.survey }}"
        survey_spec: "{{ lookup('ansible.builtin.file', 'surveys/change_request.json') | from_json if item.1.survey else omit }}"
        allow_simultaneous: false
      loop: "{{ awx_environments | product(awx_job_templates) | list }}"
      loop_control:
        label: "{{ item.1.name }} ({{ item.0 }})"
