---
# DEV inventory. In AWX: Inventory -> Sources -> "Sourced from a Project" -> inventories/dev/hosts.yml
all:
  children:
    env_dev:
      children:
        snowflake:
          hosts:
            snowflake_dev:
              # Snowflake is an API target: modules run on the controller / AWX execution environment.
              ansible_connection: local
              ansible_python_interpreter: "{{ ansible_playbook_python }}"
        windows_ad:
          hosts:
            ad-mgmt01.corp.example.com: {}
