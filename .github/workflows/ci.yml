name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # iacforge.snowflake_iac comes from the iac_forge repo. While that repo is private, add a
      # fine-grained token with read access to it as secret COLLECTION_REPO_TOKEN.
      COLLECTION_REPO_TOKEN: ${{ secrets.COLLECTION_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Allow git access to the collection repo
        if: env.COLLECTION_REPO_TOKEN != ''
        run: git config --global url."https://x-access-token:${COLLECTION_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: ansible-galaxy collection install -r collections/requirements.yml -p ./collections
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: Collection modules resolve
        run: ANSIBLE_COLLECTIONS_PATH=$PWD/collections ansible-doc -l iacforge.snowflake_iac
      - name: Playbook syntax
        run: for p in site.yml 0*.yml 99_*.yml; do ansible-playbook --syntax-check "$p"; done

  vault-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Committed vault files must be encrypted
        run: |
          status=0
          for f in $(git ls-files 'group_vars/*/vault.yml'); do
            if ! head -1 "$f" | grep -q '^\$ANSIBLE_VAULT'; then
              echo "::error file=$f::not encrypted with ansible-vault"; status=1
            fi
          done
          if git ls-files | grep -E '\.(p8|pem|key)$'; then
            echo "::error::private key files must not be committed"; status=1
          fi
          exit $status

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
