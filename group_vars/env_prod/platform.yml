---
# Desired state for PROD. Changes require a ServiceNow CR (servicenow_require_cr_envs).
sf_env: prod
sf_ops_warehouse: WH_PLATFORM_OPS_PROD

sf_resource_monitors:
  - name: RM_PLATFORM_PROD
    credit_quota: 50
    notify_at: [75, 90]
    suspend_at: 100

sf_warehouses:
  - name: WH_PLATFORM_OPS_PROD
    size: XSMALL
    auto_suspend: 60
    resource_monitor: RM_PLATFORM_PROD
    comment: Platform automation and alerts
  - name: WH_ANALYTICS_PROD
    size: SMALL
    auto_suspend: 120
    resource_monitor: RM_PLATFORM_PROD
    comment: Analytics consumers

sf_databases:
  - name: PLATFORM_OPS
    schemas: [MONITORING]
    data_retention_time_in_days: 7
  - name: TASTY_BYTES_DEMO
    schemas: [RAW_POS, RAW_CUSTOMER, ANALYTICS]
    data_retention_time_in_days: 1

sf_roles:
  - name: PLATFORM_ENGINEER
    comment: Platform engineers
    granted_to_roles: [SYSADMIN]
  - name: PLATFORM_READER
    comment: Read-only analytics
    granted_to_roles: [PLATFORM_ENGINEER]

sf_grants:
  - {privileges: [USAGE], object_type: warehouse, object_name: WH_ANALYTICS_PROD, to_role: PLATFORM_READER}
  - {privileges: [USAGE], object_type: database, object_name: TASTY_BYTES_DEMO, to_role: PLATFORM_READER}
  - {privileges: [USAGE], object_type: schema, object_name: TASTY_BYTES_DEMO.ANALYTICS, to_role: PLATFORM_READER}
  - {privileges: [SELECT], object_type: future_views_in_schema, object_name: TASTY_BYTES_DEMO.ANALYTICS, to_role: PLATFORM_READER}
  - {privileges: [SELECT], object_type: all_views_in_schema, object_name: TASTY_BYTES_DEMO.ANALYTICS, to_role: PLATFORM_READER}
  - {privileges: [OPERATE, MONITOR], object_type: warehouse, object_name: WH_PLATFORM_OPS_PROD, to_role: PLATFORM_ENGINEER}
  - {privileges: [USAGE], object_type: database, object_name: PLATFORM_OPS, to_role: PLATFORM_ENGINEER}
  - {privileges: [USAGE], object_type: schema, object_name: PLATFORM_OPS.MONITORING, to_role: PLATFORM_ENGINEER}
  - {privileges: [SELECT], object_type: future_tables_in_schema, object_name: PLATFORM_OPS.MONITORING, to_role: PLATFORM_ENGINEER}

# Self-healing never suspends these automatically
sf_remediation_protected_warehouses: [WH_PLATFORM_OPS_PROD]
