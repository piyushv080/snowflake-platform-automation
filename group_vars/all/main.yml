---
# Common, non-secret settings. Secrets come from group_vars/env_<env>/vault.yml (Ansible Vault)
# or from the AWX "Snowflake Key Pair" credential, which injects the same variable names.

# Connection used by every iacforge.snowflake_iac module (module_defaults in each playbook)
sf_account: "{{ vault_sf_account }}"
sf_user: "{{ vault_sf_user }}"
sf_private_key: "{{ vault_sf_private_key }}"
sf_private_key_passphrase: "{{ vault_sf_private_key_passphrase | default(omit) }}"

# Snowflake roles used per type of change (least privilege per task)
sf_role_sysadmin: SYSADMIN
sf_role_securityadmin: SECURITYADMIN
sf_role_accountadmin: ACCOUNTADMIN
sf_role_automation: PLATFORM_AUTOMATION_ROLE

# ServiceNow (servicenow.itsm). Disabled by default so the project runs without an instance.
servicenow_enabled: false
servicenow_require_cr_envs: [prod]
servicenow_allowed_states: [implement]
servicenow_instance:
  host: "{{ vault_servicenow_host | default(lookup('ansible.builtin.env', 'SN_HOST')) }}"
  username: "{{ vault_servicenow_username | default(lookup('ansible.builtin.env', 'SN_USERNAME')) }}"
  password: "{{ vault_servicenow_password | default(lookup('ansible.builtin.env', 'SN_PASSWORD')) }}"
cr_number: ""
