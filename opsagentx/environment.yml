# Packages for the Streamlit in Snowflake WAREHOUSE runtime.
# Resolved from the Snowflake Anaconda channel only (no PyPI, no external access needed).
# Versions verified available in SNOWFLAKE.INFORMATION_SCHEMA.PACKAGES during Stage 1/8.
name: opsagentx
channels:
  - snowflake
dependencies:
  - python=3.11
  - streamlit=1.52.2
  - pydantic=2.8.2
  - snowflake-snowpark-python
  - snowflake.core
  - pandas
