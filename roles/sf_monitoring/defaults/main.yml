---
sf_monitoring_role: "{{ sf_role_automation }}"   # owns alerts; has EXECUTE ALERT + MONITOR USAGE (sf_bootstrap)
sf_monitoring_warehouse: "{{ sf_ops_warehouse }}"
sf_monitoring_database: PLATFORM_OPS
sf_monitoring_schema: MONITORING

# Snowflake objects: events table + alerts that feed Event-Driven Ansible
sf_monitoring_deploy_objects: true
sf_monitoring_replace_alerts: false              # true = re-create alerts with new thresholds
# Empty = serverless alerts (no warehouse is woken up every run; needs EXECUTE MANAGED ALERT).
# Set a warehouse name to run alerts on that warehouse instead.
sf_monitoring_alert_warehouse: ""
sf_monitoring_credit_spike_threshold: 2          # credits per warehouse per hour
sf_monitoring_credit_spike_schedule: 60 MINUTE
sf_monitoring_task_failure_schedule: 60 MINUTE

# Cost report (ACCOUNT_USAGE, latency up to ~3h)
sf_monitoring_cost_report: true
sf_monitoring_cost_days: 30
sf_monitoring_price_per_credit: null             # your contract rate; null = credits only
sf_monitoring_report_dir: "{{ playbook_dir }}/reports"

# Warehouse hygiene policy
sf_monitoring_hygiene: true
sf_monitoring_max_auto_suspend: 600
sf_monitoring_idle_days: 14
sf_monitoring_fail_on_findings: false
sf_monitoring_incident_on_findings: false
