---
- name: Read AD group membership on the Windows management host (PowerShell)
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'Get-ADGroupMembers.ps1') }}"
    parameters:
      MappingJson: "{{ sf_user_lifecycle_mappings | to_json }}"
  delegate_to: "{{ sf_user_lifecycle_ad_host }}"
  run_once: true
  check_mode: false          # read-only query, safe to run during --check
  changed_when: false
  register: sf_ad

- name: Build desired state from AD
  ansible.builtin.set_fact:
    sf_desired_users: "{{ sf_ad.result | default([]) }}"
    sf_managed_roles: "{{ sf_user_lifecycle_mappings | map(attribute='snowflake_role') | map('upper') | unique | list }}"

- name: Guard against an empty AD result
  ansible.builtin.assert:
    that: sf_desired_users | length >= sf_user_lifecycle_min_users | int
    fail_msg: "AD returned {{ sf_desired_users | length }} users; refusing to sync (min {{ sf_user_lifecycle_min_users }})"

- name: Joiners and movers - create users and align managed roles
  snowflake_user:
    name: "{{ item.name }}"
    type: PERSON
    login_name: "{{ item.login_name | default(omit, true) }}"
    display_name: "{{ item.display_name | default(omit, true) }}"
    email: "{{ item.email | default(omit, true) }}"
    comment: "{{ sf_user_lifecycle_comment }}"
    default_role: "{{ item.roles | first }}"
    default_warehouse: "{{ sf_user_lifecycle_default_warehouse }}"
    disabled: false
    roles: "{{ item.roles }}"
    roles_scope: "{{ sf_managed_roles }}"
    role: "{{ sf_role_securityadmin }}"
  loop: "{{ sf_desired_users }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.roles | join(',') }}"

- name: List Snowflake users
  snowflake_query:
    sql: SHOW USERS
    read_only: true
    max_rows: 100000
    role: "{{ sf_role_securityadmin }}"
  register: sf_all_users

- name: Find leavers (managed users no longer in any mapped group)
  ansible.builtin.set_fact:
    sf_leavers: >-
      {{ sf_all_users.rows
         | selectattr('comment', 'equalto', sf_user_lifecycle_comment)
         | rejectattr('name', 'in', sf_desired_users | map(attribute='name') | list)
         | rejectattr('disabled', 'equalto', 'true')
         | map(attribute='name') | list }}

- name: Guard against mass disable
  ansible.builtin.assert:
    that: sf_leavers | length <= sf_user_lifecycle_max_leavers | int
    fail_msg: "{{ sf_leavers | length }} leavers exceeds sf_user_lifecycle_max_leavers; review AD before re-running"

- name: Leavers - disable user and remove managed roles
  snowflake_user:
    name: "{{ item }}"
    disabled: true
    roles: []
    roles_scope: "{{ sf_managed_roles }}"
    role: "{{ sf_role_securityadmin }}"
  loop: "{{ sf_leavers }}"
  when: sf_user_lifecycle_disable_leavers | bool

- name: Summary
  ansible.builtin.debug:
    msg: "{{ sf_desired_users | length }} users in sync, {{ sf_leavers | length }} leavers: {{ sf_leavers }}"
