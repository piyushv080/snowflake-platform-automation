---
- name: Ensure functional roles and hierarchy
  snowflake_role:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    comment: "{{ item.comment | default(omit) }}"
    granted_to_roles: "{{ item.granted_to_roles | default([]) }}"
    revoke_others: "{{ item.revoke_others | default(false) }}"
    role: "{{ sf_role_securityadmin }}"
  loop: "{{ sf_roles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure privilege grants
  snowflake_grant:
    privileges: "{{ item.privileges }}"
    object_type: "{{ item.object_type }}"
    object_name: "{{ item.object_name | default(omit) }}"
    to_role: "{{ item.to_role }}"
    state: "{{ item.state | default('present') }}"
    role: "{{ sf_role_securityadmin }}"
  loop: "{{ sf_grants }}"
  loop_control:
    label: "{{ item.privileges | join(',') }} on {{ item.object_type }} {{ item.object_name | default('') }} -> {{ item.to_role }}"
